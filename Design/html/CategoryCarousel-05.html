<html lang="ru"><head><meta charset="utf-8"><title>Тап → поиск</title>

<style>html body{margin:0;padding:0}

:root{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#111111;--ink2:#6B6B70;--line:rgba(17,17,17,.12);--accent:#FFD60A;
 --sh:3px 3px 0 var(--ink);--sh2:2px 2px 0 var(--ink);--bd:1.5px solid var(--ink);
 --disp:Unbounded,-apple-system,system-ui,sans-serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}


:where(button){appearance:none;border:0;background:none;font:inherit;color:inherit;padding:0;margin:0;cursor:pointer}
.phone{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #111,0 30px 60px rgba(0,0,0,.25);flex:none}
@media (max-width:440px){body{padding:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.side{display:none}}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font:600 17px/22px var(--sans)}
.sheet{position:absolute;inset:54px 0 0;border-top:var(--bd);border-radius:22px 22px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;background:var(--bg)}
.ic{display:block;flex:none}
.pill{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 8px;border:var(--bd);border-radius:12px;background:var(--surface)}
.seg{display:flex;height:44px;border:var(--bd);border-radius:12px;background:var(--surface);overflow:hidden}
.seg button{padding:0 14px;display:flex;gap:6px;align-items:center;font:600 15px/18px var(--sans);color:var(--ink2)}
.seg button.on{background:var(--accent);color:#111;font-weight:700;border-right:var(--bd)}
.amt{text-align:center;font:700 48px/56px var(--disp);letter-spacing:-.03em;margin-top:0;white-space:nowrap}
.amt.zero{color:var(--ink2)}.amt.sm{font-size:38px}
.expr{margin-top:8px;height:22px;text-align:center;font:500 15px/22px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden}
.expr i{font-style:normal;color:var(--ink);font-weight:700}
.err{height:16px;text-align:center;font:600 12px/16px var(--sans);color:#C4281C}
.amt span{color:var(--ink2);font-weight:500;margin-left:8px}
.meta{display:flex;justify-content:center;gap:8px;margin-top:8px}
.meta .pill{height:34px;box-shadow:none;white-space:nowrap}
.note{margin-top:10px;height:44px;border:var(--bd);border-radius:14px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink2);font:400 16px/20px var(--sans)}
/* carousel */
.car{position:relative;margin:12px -20px 0;height:118px;border-top:var(--bd);border-bottom:var(--bd);background:var(--surface)}
.track{position:absolute;inset:0 0 34px;display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - 26px);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.it{flex:none;width:52px;height:52px;border-radius:14px;border:var(--bd);display:grid;place-items:center;scroll-snap-align:center;color:#111;transform-origin:50% 60%;will-change:transform}
.it.tool{border-style:dashed;background:var(--bg);color:var(--ink)}
.it.sel{box-shadow:var(--sh2)}
.frame{position:absolute;left:50%;top:6px;width:70px;height:70px;margin-left:-35px;border-radius:18px;border:2px solid var(--ink);pointer-events:none;box-shadow:inset 0 0 0 3px var(--accent)}
.lab{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 15px/20px var(--sans);height:20px;transition:opacity .12s}
.lab small{font:500 12px/20px var(--mono);color:var(--ink2);margin-left:6px}
.fadeL,.fadeR{position:absolute;top:0;bottom:34px;width:46px;pointer-events:none;z-index:2}
.fadeL{left:0;background:linear-gradient(90deg,var(--surface),rgba(255,255,255,0))}
.fadeR{right:0;background:linear-gradient(-90deg,var(--surface),rgba(255,255,255,0))}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key.opk{background:var(--ink);color:var(--bg);font:700 26px/1 var(--mono)}
.cta.off{background:var(--bg);color:var(--ink2);box-shadow:none;border-style:dashed;cursor:default}
.cta .eq{font:700 20px/1 var(--mono);margin-right:2px}
.key{height:50px;border:var(--bd);border-radius:12px;background:var(--surface);display:grid;place-items:center;font:500 24px/1 var(--mono)}
.key.op{background:var(--bg)}
.key:active{transform:translate(2px,2px)}
.cta{margin-top:10px;height:56px;border-radius:12px;border:var(--bd);background:var(--accent);color:#111;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:8px;font:700 17px/20px var(--sans);width:100%}
.cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hi{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:20}
/* sheet list */
.scrim{position:absolute;inset:0;background:rgba(17,17,17,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.list{position:absolute;left:0;right:0;bottom:0;top:110px;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(17,17,17,.12);padding:10px 20px 34px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:11;display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}.list.show{transform:none}
.list.short{top:auto;max-height:80%}
.grab{background:#C9C5BC!important}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink);margin:0 auto 12px}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lh b{font:700 22px/28px var(--disp)}
.srch{height:46px;border:var(--bd);border-radius:12px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 12px}
.srch input{flex:1;border:0;outline:0;background:none;font:400 16px/20px var(--sans);color:var(--ink);min-width:0}
.glist{margin-top:12px;border:var(--bd);border-radius:14px;background:var(--surface);overflow:auto;flex:1;min-height:0}
.r{width:100%;display:flex;align-items:center;gap:12px;padding:0 14px 0 10px;height:54px;text-align:left}
.r+.r{border-top:1px solid var(--line)}
.r b{flex:1;font:600 16px/20px var(--sans)}
.r .num{font:500 12px/14px var(--mono);color:var(--ink2)}
.r.on{background:var(--accent);color:#111}
.r .tl{width:34px;height:34px;border-radius:9px;border:var(--bd);display:grid;place-items:center;color:#111}
.acc{width:100%;display:flex;align-items:center;gap:12px;padding:0 14px 0 10px;height:64px;text-align:left}
.acc+.acc{border-top:1px solid var(--line)}
.acc .cd{width:46px;height:32px;border-radius:7px;border:var(--bd);display:grid;place-items:center;color:#fff}
.acc .t{flex:1;display:flex;flex-direction:column}.acc .t b{font:600 16px/20px var(--sans)}.acc .t span{font:500 12px/16px var(--mono);color:var(--ink2)}
.acc.on{background:var(--accent);color:#111}.acc.on .t span{color:#111}
.chk{width:26px;height:26px;border-radius:50%;border:var(--bd);display:grid;place-items:center;background:var(--surface)}
.acc.on .chk{background:var(--ink);color:var(--accent)}
.qd{display:flex;gap:8px;margin-bottom:12px}
.qd button{flex:1;height:44px;border:var(--bd);border-radius:12px;background:var(--surface);font:600 15px/18px var(--sans)}
.qd button.on{background:var(--accent);box-shadow:var(--sh2);color:#111}
.cal{border:var(--bd);border-radius:14px;background:var(--surface);padding:10px 10px 12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font:700 16px/20px var(--disp)}
.calh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.calh button[disabled]{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg .w{font:600 11px/20px var(--sans);color:var(--ink2);text-transform:uppercase}
.cg button{height:40px;border-radius:10px;font:500 15px/1 var(--mono)}
.cg button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cg button.on{background:var(--accent);border:var(--bd);box-shadow:var(--sh2);color:#111;font-weight:700}
.cg button[disabled]{color:#C3C0B8;cursor:default}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;height:48px;border:var(--bd);border-radius:12px;background:var(--surface);padding:0 8px 0 14px;font:600 15px/18px var(--sans)}
.trow .tm{display:flex;align-items:center;gap:6px}.trow .tm button{width:34px;height:34px;border-radius:9px;border:var(--bd);background:var(--bg);font:700 16px/1 var(--mono)}
.trow .tm span{font:700 16px/1 var(--mono);min-width:56px;text-align:center}
.done{margin-top:14px}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.side{max-width:330px;font:400 15px/22px var(--sans)}
.side h1{font:700 24px/30px var(--disp);margin:0 0 10px}
.side ol{padding-left:20px;margin:0}
.side li{margin-bottom:8px}
.side code{font:500 13px var(--mono);background:var(--surface);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
@media (prefers-reduced-motion:reduce){.list,.scrim{transition:none}}

.phone{border-radius:0!important;box-shadow:none!important}
.phone{font-family:var(--sans)}
.seg{flex:1;margin:0 10px}
.seg button{flex:1;justify-content:center;padding:0 6px;font-size:14px}
</style>
